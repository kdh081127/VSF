// ═══════════════════════════════════════════════════════════════
// 유틸
// ═══════════════════════════════════════════════════════════════
function getColor(s){let h=0;for(const c of(s||'?'))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function parseYTId(url){const m=url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null}
function thumbUrl(id){return`https://img.youtube.com/vi/${id}/mqdefault.jpg`}
function ytUrl(id){return`https://www.youtube.com/watch?v=${id}`}
function timeAgo(iso){
  if(!iso)return'';
  const d=(Date.now()-new Date(iso))/864e5;
  if(d<1)return'오늘';if(d<2)return'어제';if(d<7)return`${Math.floor(d)}일 전`;
  if(d<30)return`${Math.floor(d/7)}주 전`;return`${Math.floor(d/30)}개월 전`;
}
function fmtNum(n){if(n>=1000)return(n/1000).toFixed(1)+'k';return String(n||0)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

async function fetchYTMeta(videoId){
  const r=await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
  if(!r.ok)throw new Error('oEmbed 실패');
  return r.json();
}

window._fbQ=[];
window._fbReady=false;
function _onFbReady(fn){if(window._fbReady)fn();else window._fbQ.push(fn);}

(function(){
  const s=document.createElement('script');
  s.type='module';
  s.textContent=`
    import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import{getFirestore,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    const app=initializeApp(${JSON.stringify({
      apiKey:"AIzaSyDpezWSNABY7hRhjo3GsjaYYaLBRNUipak",
      authDomain:"vsf-archive.firebaseapp.com",
      projectId:"vsf-archive",
      storageBucket:"vsf-archive.firebasestorage.app",
      messagingSenderId:"781816955454",
      appId:"1:781816955454:web:92ed80c3866d06d0c6076f"
    })});
    const db=getFirestore(app);
    window._fsGet=async(key)=>{
      try{const snap=await getDoc(doc(db,'vsf',key));return snap.exists()?snap.data().value:null}catch{return null}
    };
    window._fsSet=async(key,val)=>{
      try{await setDoc(doc(db,'vsf',key),{value:val})}catch(e){console.error(e)}
    };
    window._fbReady=true;
    window._fbQ.forEach(f=>f());
  `;
  document.head.appendChild(s);
})();

async function sGet(key){
  await new Promise(r=>_onFbReady(r));
  try{const v=await window._fsGet(key);return v?JSON.parse(v):null}catch{return null}
}
async function sSet(key,val){
  await new Promise(r=>_onFbReady(r));
  try{await window._fsSet(key,JSON.stringify(val))}catch{}
}

function $(id){return document.getElementById(id)}
function render(){
  const root=$('root');if(!root)return;
  let html='';
  html+=renderHeader();
  html+=`<div style="min-height:calc(100vh - 56px)">`;
  if(ST.loading){html+=renderLoading();}
  else if(ST.page==='home'){html+=renderHome();}
  else if(ST.page==='add'){html+=renderAdd();}
  else if(ST.page==='channel'){html+=renderChannel();}
  else if(ST.page==='ranking'){html+=renderRanking();}
  else if(ST.page==='lyrics'){html+=renderLyrics();}
  html+=`</div>`;
  if(ST.detailId)html+=renderDetail();
  if(ST.editChannelFor)html+=renderChannelEditModal();
  if(ST.toast)html+=renderToast();
  root.innerHTML=html;
  bindEvents();
}
function bindEvents(){
  // 검색
  const si=$('searchInp');
  if(si)si.addEventListener('input',e=>{ST.search=e.target.value;render()});
  // 추가 폼
  const ui=$('urlInp');if(ui)ui.addEventListener('input',e=>{ST.addUrl=e.target.value});
  const stri=$('streamerInp');if(stri)stri.addEventListener('input',e=>{ST.addStreamer=e.target.value});
  const agi=$('agencyInp');if(agi)agi.addEventListener('change',e=>{ST.addAgency=e.target.value});
  const ori=$('origInp');if(ori)ori.addEventListener('input',e=>{ST.addOriginal=e.target.value});
  // URL 엔터키
  if(ui)ui.addEventListener('keydown',e=>{if(e.key==='Enter')previewYT()});
  // 채널 편집 폼
  const cyu=$('chYtUrlInp');if(cyu)cyu.addEventListener('input',e=>{ST.editYtUrl=e.target.value});
  const cav=$('chAvatarInp');if(cav)cav.addEventListener('input',e=>{ST.editAvatarUrl=e.target.value});
  const cde=$('chDescInp');if(cde)cde.addEventListener('input',e=>{ST.editDesc=e.target.value});
}

function renderLoading(){

function renderToast(){

}

function renderHeader(){
  const navs=[{k:'home',i:'🏠',l:'홈'},{k:'channel',i:'📺',l:'채널'},{k:'ranking',i:'🏆',l:'랭킹'}];

    </button>
    <div style="display:flex;gap:2px;margin-left:4px">
      ${navs.map(n=>`<button onclick="nav('${n.k}')" style="background:${ST.page===n.k?C.pur+'22':'none'};border:1px solid ${ST.page===n.k?C.pur+'66':'transparent'};border-radius:8px;padding:4px 10px;color:${ST.page===n.k?C.purL:C.muted};font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px">${n.i} ${n.l}</button>`).join('')}
    </div>
    <div style="flex:1"></div>
    ${ST.page==='home'?`<div style="position:relative;width:190px">

      <input id="searchInp" type="text" placeholder="검색..." value="${esc(ST.search)}"
        style="width:100%;background:${C.card};border:1px solid ${C.b};border-radius:10px;padding:7px 10px 7px 28px;color:${C.txt};font-size:13px;outline:none">

    ${ST.isAdmin
      ? `<button onclick="nav('add')" style="background:linear-gradient(135deg,${C.pur},${C.purD});border:none;border-radius:10px;padding:7px 13px;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap">＋ 추가</button>
         <button onclick="adminLogout()" style="background:${C.pink}22;border:1px solid ${C.pink}44;border-radius:10px;padding:7px 10px;color:${C.pink};font-size:12px;font-weight:600">🔓 로그아웃</button>`

// ═══════════════════════════════════════════════════════════════
// 홈
// ═══════════════════════════════════════════════════════════════
function getFiltered(){
  return ST.covers.filter(c=>{
    const q=ST.search.toLowerCase();
    const mq=!q||[c.title,c.streamer,c.original,c.agency].some(x=>x?.toLowerCase().includes(q));
    const ma=ST.agency==='전체'||c.agency===ST.agency;
    const mt=ST.tag==='전체'||(c.tags||[]).includes(ST.tag);
    return mq&&ma&&mt;
  }).sort((a,b)=>{
    if(ST.sort==='added')return new Date(b.addedAt)-new Date(a.addedAt);
    if(ST.sort==='title')return(a.title||'').localeCompare(b.title||'');
    if(ST.sort==='likes')return(ST.likes[b.id]||0)-(ST.likes[a.id]||0);
    if(ST.sort==='views')return(ST.views[b.id]||0)-(ST.views[a.id]||0);
    return 0;
  });
}

function renderHome(){
  const list=getFiltered();
  const streamers=[...new Set(ST.covers.map(c=>c.streamer).filter(Boolean))].length;
  const agencies=[...new Set(ST.covers.map(c=>c.agency).filter(Boolean))].length;
  const latest=ST.covers.slice().sort((a,b)=>new Date(b.addedAt)-new Date(a.addedAt))[0];
  const stats=[
    {i:'🎵',v:ST.covers.length+'곡',l:'총 커버곡'},
    {i:'🌟',v:streamers+'명',l:'스트리머'},
    {i:'🏢',v:agencies+'개',l:'소속사'},
    {i:'📅',v:latest?timeAgo(latest.addedAt):'—',l:'마지막 추가'},
  ];
  const sortOpts=[{k:'added',l:'최근 추가순'},{k:'title',l:'제목순'},{k:'likes',l:'좋아요순'},{k:'views',l:'조회순'}];

  return`<div style="max-width:1100px;margin:0 auto;padding:24px 16px">
    <!-- 히어로 -->
    <div style="background:linear-gradient(135deg,${C.s2},#0A0A16);border:1px solid ${C.b};border-radius:20px;padding:24px 24px 20px;margin-bottom:20px;position:relative;overflow:hidden">
      <div style="position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,${C.pur}18,transparent 70%);pointer-events:none"></div>
      <div style="position:absolute;bottom:-30px;left:30%;width:140px;height:140px;background:radial-gradient(circle,${C.pink}12,transparent 70%);pointer-events:none"></div>
      <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-0.5px">🇰🇷 한국 버츄얼 스트리머 커버곡 아카이브</h1>
      <p style="font-size:13px;color:${C.muted};margin:0 0 18px">YouTube 링크만 붙여넣으면 자동 등록 · 모두와 공유됩니다</p>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        ${stats.map(s=>`<div style="background:${C.card};border:1px solid ${C.b};border-radius:13px;padding:12px 14px">
          <div style="font-size:18px;margin-bottom:3px">${s.i}</div>
          <div style="font-size:18px;font-weight:700">${esc(s.v)}</div>
          <div style="font-size:11px;color:${C.dim}">${s.l}</div>
        </div>`).join('')}
      </div>
    </div>

    <!-- 필터 -->
    <div style="background:${C.s2};border:1px solid ${C.b};border-radius:16px;padding:14px 16px;margin-bottom:16px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:9px">
        <span style="font-size:11px;color:${C.dim};font-weight:600;min-width:36px">소속사</span>
        ${AGENCIES.map(a=>`<button onclick="setF('agency','${esc(a)}')" style="background:${ST.agency===a?C.pur+'22':C.card};border:1px solid ${ST.agency===a?C.pur+'66':C.b};color:${ST.agency===a?C.purL:C.muted};border-radius:20px;padding:4px 11px;font-size:12px;font-weight:${ST.agency===a?600:400}">${esc(a)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:9px">
        <span style="font-size:11px;color:${C.dim};font-weight:600;min-width:36px">태그</span>
        <button onclick="setF('tag','전체')" style="background:${ST.tag==='전체'?C.pink+'22':C.card};border:1px solid ${ST.tag==='전체'?C.pink+'66':C.b};color:${ST.tag==='전체'?C.pinkL:C.muted};border-radius:20px;padding:4px 11px;font-size:12px">전체</button>
        ${TAGS_LIST.map(t=>`<button onclick="setF('tag','${esc(t)}')" style="background:${ST.tag===t?C.pink+'22':C.card};border:1px solid ${ST.tag===t?C.pink+'66':C.b};color:${ST.tag===t?C.pinkL:C.muted};border-radius:20px;padding:4px 11px;font-size:12px;font-weight:${ST.tag===t?600:400}">${esc(t)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span style="font-size:11px;color:${C.dim};font-weight:600;min-width:36px">정렬</span>
        ${sortOpts.map(s=>`<button onclick="setF('sort','${s.k}')" style="background:${ST.sort===s.k?C.cyan+'22':C.card};border:1px solid ${ST.sort===s.k?C.cyan+'66':C.b};color:${ST.sort===s.k?C.cyanL:C.muted};border-radius:20px;padding:4px 11px;font-size:12px;font-weight:${ST.sort===s.k?600:400}">${s.l}</button>`).join('')}

    <div style="font-size:13px;color:${C.muted};margin-bottom:14px">

    <!-- 그리드 -->
    ${list.length===0
      ?`<div style="text-align:center;padding:80px 20px;color:${C.dim}">
          <div style="font-size:48px;margin-bottom:14px">${ST.covers.length===0?'🎙':'🔍'}</div>
          <div style="font-size:16px">${ST.covers.length===0?'아직 등록된 커버곡이 없어요':'검색 결과가 없습니다'}</div>
        </div>`
      :`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">
          ${list.map(c=>renderCard(c)).join('')}
        </div>`
    }
  </div>`;

function renderCard(c){
  const col=getColor(c.streamer||'?');
  const liked=ST.myLikes.has(c.id);
  return`<div onclick="openDetail('${esc(c.id)}')" class="card"
    style="background:${C.card};border:1px solid ${C.b};border-radius:16px;overflow:hidden;cursor:pointer"
    onmouseenter="this.style.borderColor='${col}66';this.style.boxShadow='0 4px 24px ${col}22'"
    onmouseleave="this.style.borderColor='${C.b}';this.style.boxShadow='none'">
    <div style="position:relative;width:100%;padding-top:56.25%;background:${C.s2};overflow:hidden">
      ${c.videoId?`<img src="${thumbUrl(c.videoId)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">`:''}
      <div style="position:absolute;inset:0;background:linear-gradient(to top,${C.card}CC,transparent 60%)"></div>
      <div style="position:absolute;top:8px;right:8px">
        <a href="${ytUrl(c.videoId)}" target="_blank" onclick="event.stopPropagation()"
          style="background:rgba(0,0,0,.75);border-radius:6px;padding:3px 8px;font-size:11px;color:#fff">▶</a>
      </div>
      ${c.agency?`<div style="position:absolute;bottom:8px;left:8px;background:${col}22;border:1px solid ${col}55;border-radius:20px;padding:2px 8px;font-size:10px;color:${col};font-weight:700">${esc(c.agency)}</div>`:''}
    </div>
    <div style="padding:12px 14px">
      <div style="font-size:14px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(c.title)}">${esc(c.title||'제목 없음')}</div>
      ${c.original?`<div style="font-size:11px;color:${C.muted};margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">원곡: ${esc(c.original)}</div>`:'<div style="height:17px;margin-bottom:6px"></div>'}
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:8px">

// 채널 페이지

function getAllStreamers(){
  const map={};
  ST.covers.forEach(c=>{
    if(!c.streamer)return;
    if(!map[c.streamer])map[c.streamer]={name:c.streamer,agency:c.agency||'',count:0,likes:0,latest:null};
    map[c.streamer].count++;
    map[c.streamer].likes+=(ST.likes[c.id]||0);
    if(!map[c.streamer].latest||new Date(c.addedAt)>new Date(map[c.streamer].latest))
      map[c.streamer].latest=c.addedAt;
  });
  // channelInfo 병합 (YouTube 채널 URL, 프로필 이미지 등)
  Object.values(map).forEach(s=>{
    const ci=ST.channelInfo[s.name]||{};
    s.ytUrl=ci.ytUrl||'';
    s.avatarUrl=ci.avatarUrl||'';
    s.description=ci.description||'';
  });
  return Object.values(map).sort((a,b)=>b.count-a.count);
}

  if(!ST.channelStreamer){
    // ── 전체 채널 목록 ──
    const streamers=getAllStreamers();
    return`<div style="max-width:1100px;margin:0 auto;padding:24px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">

        <div style="font-size:12px;color:${C.dim}">${streamers.length}개 채널</div>
      </div>
      ${streamers.length===0
        ?`<div style="text-align:center;padding:80px;color:${C.dim}">
            <div style="font-size:48px;margin-bottom:14px">📺</div>

            return`<div onclick="goChannel('${esc(s.name)}')" class="card"

        <div style="position:relative;flex-shrink:0">

            ?`<img src="${esc(ci.avatarUrl)}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid ${col}66" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            :''}
          <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,${col},${col}88);display:${ci.avatarUrl?'none':'flex'};align-items:center;justify-content:center;font-size:34px;color:#fff;font-weight:800;border:3px solid ${col}44">${esc(ST.channelStreamer[0])}</div>
          ${hasYT?`<div style="position:absolute;bottom:0;right:0;width:22px;height:22px;background:#FF0000;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid ${C.s2}">▶</div>`:''}

        <!-- 이름 / 소속 / 설명 -->
        <div style="flex:1;min-width:0">

              style="background:${col}22;border:1px solid ${col}44;border-radius:10px;padding:7px 12px;color:${col};font-size:12px;font-weight:600">

          </div>
        </div>
      </div>

      <!-- 통계 -->
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${[{i:'🎵',v:covers.length+'곡',l:'커버곡'},{i:'❤️',v:fmtNum(totalLikes),l:'총 좋아요'},{i:'👁',v:fmtNum(totalViews),l:'총 조회수'}].map(s=>`
          <div style="background:${C.card};border:1px solid ${C.b};border-radius:12px;padding:10px 18px;flex:1;min-width:80px;text-align:center">
            <div style="font-size:16px;margin-bottom:2px">${s.i}</div>

// ═══════════════════════════════════════════════════════════════
// 랭킹 페이지
// ═══════════════════════════════════════════════════════════════
function renderRanking(){
  const byViews=ST.covers.slice().sort((a,b)=>(ST.views[b.id]||0)-(ST.views[a.id]||0));
  const byLikes=ST.covers.slice().sort((a,b)=>(ST.likes[b.id]||0)-(ST.likes[a.id]||0));
  const list=ST.rankTab==='views'?byViews:byLikes;
  const getVal=c=>ST.rankTab==='views'?(ST.views[c.id]||0):(ST.likes[c.id]||0);
  const maxVal=Math.max(1,...list.map(c=>getVal(c)));
  const medals=['🥇','🥈','🥉'];

  return`<div style="max-width:800px;margin:0 auto;padding:24px 16px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <h2 style="font-size:22px;font-weight:800">🏆 랭킹</h2>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <button onclick="ST.rankTab='views';render()" style="background:${ST.rankTab==='views'?C.pur+'22':C.card};border:1px solid ${ST.rankTab==='views'?C.pur+'66':C.b};color:${ST.rankTab==='views'?C.purL:C.muted};border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600">👁 조회수 TOP</button>
      <button onclick="ST.rankTab='likes';render()" style="background:${ST.rankTab==='likes'?C.pur+'22':C.card};border:1px solid ${ST.rankTab==='likes'?C.pur+'66':C.b};color:${ST.rankTab==='likes'?C.purL:C.muted};border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600">❤️ 좋아요 TOP</button>
    </div>
    ${list.length===0
      ?`<div style="text-align:center;padding:80px;color:${C.dim}">아직 데이터가 없습니다</div>`
      :`<div style="display:flex;flex-direction:column;gap:10px">
        ${list.slice(0,20).map((c,i)=>{
          const col=getColor(c.streamer||'?');
          const val=getVal(c);
          const pct=Math.max(4,(val/maxVal)*100);
          const isTop=i<3;
          return`<div onclick="openDetail('${esc(c.id)}')" class="card"
            style="background:${C.card};border:1px solid ${isTop?col+'44':C.b};border-radius:14px;padding:16px;cursor:pointer;display:flex;align-items:center;gap:14px"
            onmouseenter="this.style.borderColor='${col}66'"
            onmouseleave="this.style.borderColor='${isTop?col+'44':C.b}'">
            <div style="font-size:22px;min-width:32px;text-align:center">
              ${isTop?medals[i]:`<span style="font-size:14px;color:${C.dim};font-weight:700">#${i+1}</span>`}
            </div>
            ${c.videoId?`<img src="${thumbUrl(c.videoId)}" style="width:72px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">`:''}
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px">${esc(c.title||'제목 없음')}</div>
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
                <span style="font-size:11px;color:${col};background:${col}22;border:1px solid ${col}44;border-radius:20px;padding:1px 8px">${esc(c.streamer)}</span>
                ${c.original?`<span style="font-size:11px;color:${C.dim};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">원곡: ${esc(c.original)}</span>`:''}
              </div>
              <div style="height:4px;background:${C.b};border-radius:2px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:${ST.rankTab==='views'?C.cyan:C.pink};border-radius:2px"></div>
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:18px;font-weight:800;color:${ST.rankTab==='views'?C.cyanL:C.pinkL}">${fmtNum(val)}</div>
              <div style="font-size:11px;color:${C.dim}">${ST.rankTab==='views'?'조회':'좋아요'}</div>
            </div>
          </div>`;
        }).join('')}
      </div>`
    }
  </div>`;
}

function renderChannelEditModal(){

window.nav=function(page){
  if(page==='add'&&!ST.isAdmin){openAdminLogin();return;}
  ST.page=page;
  ST.detailId=null;
  if(page==='add'){ST.addUrl='';ST.addStreamer='';ST.addAgency='';ST.addOriginal='';ST.addTags=[];ST.addPreview=null;ST.addError='';}
  if(page==='channel')ST.channelStreamer=null;
  render();
}

window.setF=function(k,v){ST[k]=v;render()}

window.openDetail=function(id){
  ST.detailId=id;
  // 조회수 증가
  ST.views[id]=(ST.views[id]||0)+1;
  sSet(VKEY,ST.views);
  render();
}

window.closeDetail=function(){ST.detailId=null;render()}

window.goChannel=function(streamer){
  ST.page='channel';ST.channelStreamer=streamer;ST.detailId=null;render();
}

window.openEditChannel=function(name){
  const ci=ST.channelInfo[name]||{};
  ST.editChannelFor=name;
  ST.editYtUrl=ci.ytUrl||'';
  ST.editAvatarUrl=ci.avatarUrl||'';
  ST.editDesc=ci.description||'';
  ST.editChError='';
  ST.editChLoading=false;
  render();
  setTimeout(()=>{const i=$('chYtUrlInp');if(i)i.focus();},50);
}

window.closeEditChannel=function(){
  ST.editChannelFor=null;ST.editChError='';render();
}

window.saveChannelInfo=async function(name){
  const ytUrl=($('chYtUrlInp')||{}).value||ST.editYtUrl;
  const avatarUrl=($('chAvatarInp')||{}).value||ST.editAvatarUrl;
  const description=($('chDescInp')||{}).value||ST.editDesc;
  if(!ytUrl){ST.editChError='YouTube 채널 URL을 입력해 주세요';render();return;}
  // 간단한 URL 검증
  if(!ytUrl.includes('youtube.com')&&!ytUrl.includes('youtu.be')){ST.editChError='YouTube URL 형식이 올바르지 않습니다';render();return;}
  ST.editChLoading=true;ST.editChError='';render();
  ST.channelInfo[name]={ytUrl,avatarUrl,description};
  await sSet(CHKEY,ST.channelInfo);
  ST.editChLoading=false;
  ST.editChannelFor=null;
  showToast(`✓ ${name} 채널 정보가 저장되었습니다`);
}

window.clearChannelInfo=async function(name){
  if(!confirm(`${name}의 채널 정보를 삭제할까요?`))return;
  delete ST.channelInfo[name];
  await sSet(CHKEY,ST.channelInfo);
  ST.editChannelFor=null;
  showToast('채널 정보가 삭제되었습니다');
}


window.goLyrics=function(id){
  ST.page='lyrics';ST.lyricsId=id;ST.lyricsText='';ST.lyricsLoading=false;ST.detailId=null;render();
}

window.toggleLike=function(id){
  if(ST.myLikes.has(id)){
    ST.myLikes.delete(id);
    ST.likes[id]=Math.max(0,(ST.likes[id]||0)-1);
  } else {
    ST.myLikes.add(id);
    ST.likes[id]=(ST.likes[id]||0)+1;
  }
  try{localStorage.setItem(MY_LIKES_KEY,JSON.stringify([...ST.myLikes]))}catch{}
  sSet(LKEY,ST.likes);
  render();
}

window.toggleAddTag=function(t){
  const i=ST.addTags.indexOf(t);
  if(i>=0)ST.addTags.splice(i,1);else ST.addTags.push(t);
  render();
}

window.previewYT=async function(){
  const url=($('urlInp')||{}).value||ST.addUrl;
  if(!url){ST.addError='URL을 입력해 주세요';render();return}
  const id=parseYTId(url);
  if(!id){ST.addError='유효한 YouTube URL이 아닙니다';render();return}
  ST.addUrl=url;ST.addLoading=true;ST.addError='';ST.addPreview=null;render();
  try{
    const meta=await fetchYTMeta(id);
    ST.addPreview={videoId:id,title:meta.title,channelName:meta.author_name};
  }catch{
    ST.addError='YouTube 정보를 불러오지 못했습니다. URL을 확인해 주세요.';
  }
  ST.addLoading=false;render();
}

window.submitAdd=async function(){
  const url=($('urlInp')||{}).value||ST.addUrl;
  const streamer=($('streamerInp')||{}).value||ST.addStreamer;
  const agency=($('agencyInp')||{}).value||ST.addAgency;
  const original=($('origInp')||{}).value||ST.addOriginal;
  if(!url){showToast('URL을 입력해 주세요','err');return}
  if(!streamer){showToast('스트리머명을 입력해 주세요','err');return}
  const videoId=parseYTId(url);
  if(!videoId){showToast('유효한 YouTube URL이 아닙니다','err');return}
  const cover={
    id:Date.now().toString(),
    videoId,
    title:ST.addPreview?.title||'제목 미확인',
    channelName:ST.addPreview?.channelName||'',
    streamer,agency,original,
    tags:[...ST.addTags],
    addedAt:new Date().toISOString(),
  };
  ST.covers.unshift(cover);
  await sSet(SKEY,ST.covers);
  showToast('✓ 커버곡이 등록되었습니다!');
  ST.page='home';ST.detailId=cover.id;
  ST.views[cover.id]=0;
  render();
}

window.deleteCover=async function(id){
  if(!confirm('정말 삭제할까요?'))return;
  ST.covers=ST.covers.filter(c=>c.id!==id);
  await sSet(SKEY,ST.covers);
  ST.detailId=null;
  showToast('삭제되었습니다');
}

window.loadLyrics=async function(){
  const c=ST.covers.find(x=>x.id===ST.lyricsId);
  if(!c)return;
  ST.lyricsLoading=true;ST.lyricsText='';render();
  try{
    const res=await fetch('/api/lyrics',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:c.title,original:c.original||'',streamer:c.streamer}),
    });
    const data=await res.json();
    ST.lyricsText=data.text||'가사를 불러올 수 없습니다.';
  }catch{
    ST.lyricsText='가사를 불러오는 중 오류가 발생했습니다.';
  }
  ST.lyricsLoading=false;render();
}

function showToast(msg,type='ok'){
  ST.toast={msg,type};render();
  if(_toastTimer)clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{ST.toast=null;render()},2500);
}

let _showAdminModal=false;
window.openAdminLogin=function(){_showAdminModal=true;ST.adminPwInput='';_renderWithModal();}

window.submitAdminLogin=function(){
  const pw=($('adminPwInp')||{}).value||'';

  else{ST.adminPwInput='__err__';_renderWithModal();setTimeout(()=>{const i=$('adminPwInp');if(i)i.focus();},50);}
}
function _renderWithModal(){
  const root=$('root');if(!root)return;
  let html='';
  html+=renderHeader();
  html+=`<div style="min-height:calc(100vh - 56px)">`;
  if(ST.loading){html+=renderLoading();}
  else if(ST.page==='home'){html+=renderHome();}
  else if(ST.page==='add'){html+=renderAdd();}
  else if(ST.page==='channel'){html+=renderChannel();}
  else if(ST.page==='ranking'){html+=renderRanking();}
  else if(ST.page==='lyrics'){html+=renderLyrics();}
  html+=`</div>`;
  if(ST.detailId)html+=renderDetail();
  if(_showAdminModal)html+=renderAdminModal();
  if(ST.editChannelFor)html+=renderChannelEditModal();
  if(ST.toast)html+=renderToast();
  root.innerHTML=html;
  bindEvents();
  if(_showAdminModal){const i=$('adminPwInp');if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')submitAdminLogin();});}}
}

// ESC 키
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ST.editChannelFor)closeEditChannel();
  else if(e.key==='Escape'&&ST.detailId)closeDetail();
  else if(e.key==='Escape'&&_showAdminModal)closeAdminLogin();
});

// ═══════════════════════════════════════════════════════════════
// 초기 로드 + 폴링
// ═══════════════════════════════════════════════════════════════
(async()=>{
  ST.loading=true;render();
  const [c,l,v,ch]=await Promise.all([sGet(SKEY),sGet(LKEY),sGet(VKEY),sGet(CHKEY)]);
  ST.covers=c||[];
  ST.likes=l||{};
  ST.views=v||{};
  ST.channelInfo=ch||{};
  try{
    const ml=JSON.parse(localStorage.getItem(MY_LIKES_KEY)||'[]');
    ST.myLikes=new Set(ml);
  }catch{ST.myLikes=new Set()}
  ST.loading=false;
  render();

  // 5초마다 공유 데이터 동기화
  _pollTimer=setInterval(async()=>{
    const[c,l,v,ch]=await Promise.all([sGet(SKEY),sGet(LKEY),sGet(VKEY),sGet(CHKEY)]);
    let changed=false;
    if(c&&JSON.stringify(c)!==JSON.stringify(ST.covers)){ST.covers=c;changed=true}
    if(l&&JSON.stringify(l)!==JSON.stringify(ST.likes)){ST.likes=l;changed=true}
    if(v&&JSON.stringify(v)!==JSON.stringify(ST.views)){ST.views=v;changed=true}
    if(ch&&JSON.stringify(ch)!==JSON.stringify(ST.channelInfo)){ST.channelInfo=ch;changed=true}
    if(changed)render();
  },5000);
})();
</script>
